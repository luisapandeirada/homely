<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- SEO & Brand Metadata -->
  <title>Homely - Simple Property & Tenant Management</title>
  <meta name="description" content="Simple, direct property management for landlords and tenants. Manage leases, pay rent, and handle repair requests easily.">
  <meta name="keywords" content="property management, leases, rent payments, maintenance requests, landlord, tenant">
  
  <!-- Google Fonts: Playfair Display, Plus Jakarta Sans, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="owner-mode">

  <!-- Dynamic Global Floating Navbar -->
  <nav class="glass-nav" id="global-navbar">
    <!-- app.js will dynamically render navbar structure here -->
  </nav>

  <!-- Main Viewport Target Mount -->
  <main id="app-container" class="container">
    <!-- Router redirects will inject screens dynamically here -->
    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:50vh; color:var(--text-muted);">
      <p style="font-family:var(--font-serif); font-size:18px; letter-spacing:0.04em; color:var(--text-muted);">Homely</p>
    </div>
  </main>

  <!-- JavaScript Module Bundle -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
